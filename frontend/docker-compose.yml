version: '3.9'

services:
  testing-llm-ollama:
    container_name: testing-llm-ollama
    hostname: testing-llm-ollama
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        USERNAME: ${USERNAME}
        GID: ${GID}
        GROUPNAME: ${GROUPNAME}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        FTP_PROXY: ${FTP_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        ftp_proxy: ${FTP_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    environment:
      HTPP_PROXY: ${HTPP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      FTP_PROXY: ${FTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      ftp_proxy: ${FTP_PROXY:-}
      no_proxy: ${NO_PROXY:-}
    ports:
      - ${API_LLM_PORT}:8000
    user: ${USERNAME}
    working_dir: /${USERNAME}/ollama
    volumes:
      - ./:/${USERNAME}/ollama
    tty: true
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: '10m'
